<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>for Tutut by Manuel Phil. Bischof</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="images/favicon.png">

<link rel="stylesheet" href="style.css">



</head>


<body>



<div id="page">



<!-- LEFT -->

<section id="left">


<div id="singleCard">

<img id="cardImage" src="" alt="card">

</div>



<div id="archiveGrid"></div>


</section>



<!-- CENTER -->

<div id="archiveButton">

    <div id="archiveText">
        archive
    </div>

</div>



<div id="leftLabel">phil.</div>
<div id="flash"></div>

<div id="rightLabel">.about</div>







<!-- RIGHT -->

<section id="right">


<div id="description">

<h1 id="title"></h1>

<p id="narrative"></p>

<p id="text"></p>

<p id="credits"></p>



</div>




</section>




</div>





<section id="mobile">

    <div id="mobileCard">

        <div class="front">
            <img id="mobileImage">
        </div>

        <div class="back">

            <h1 id="mobileTitle"></h1>

            <p id="mobileNarrative"></p>

            <p id="mobileText"></p>

            <p id="mobileCredits"></p>

        </div>

    </div>

        <div id="mobileArchiveGrid"></div>


   <div id="mobileShuffle">
    <img src="images/favicon.png" alt="reload">
    </div>


   <div id="mobileMenuButton">
    <span></span>
    <span></span>
    </div>


    <div id="mobileMenu">

        <div id="mobileArchive">
            archive
        </div>

        <div id="mobileAbout">
            about
        </div>

    </div>


</section>



<script src="script.js"></script>


</body>

</html>
