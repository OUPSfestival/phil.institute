<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>essey•cards•oracle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" type="image/png" href="images/favicon.png">

<link rel="stylesheet" href="style.css">



</head>


<body>



<div id="page">



<!-- LEFT -->

<section id="left">
<div id="archiveGrid"></div>
</section>




<!-- BODY and LINKS -->

<div id="singleCard">

<img id="cardImage" src="" alt="card">

</div>



<div id="info">
    .info
</div>

<div id="archiveLink">
    .archive
</div>



<div id="archiveLine"></div>






<!-- RIGHT -->

<section id="right">


<div id="description">

<h1 id="title"></h1>

<p id="narrative"></p>

<p id="text"></p>

<p id="credits"></p>



</div>




</section>




</div>





<section id="mobile">

    <div id="mobileCard">

        <div class="front">
            <img id="mobileImage">
        </div>

        <div class="back">

            <h1 id="mobileTitle"></h1>

            <p id="mobileNarrative"></p>

            <p id="mobileText"></p>

            <p id="mobileCredits"></p>

        </div>

    </div>

        <div id="mobileArchiveGrid"></div>


   <div id="mobileShuffle">
    <img src="images/favicon.png" alt="reload">
    </div>


   <div id="mobileMenuButton">
    <span></span>
    <span></span>
    </div>


    <div id="mobileMenu">

         <div id="mobileAbout">
            info
        </div>

        <div id="mobileArchive">
            archive
        </div>

    </div>


</section>


<script src="oracle.js"></script>
<script src="script.js"></script>


</body>

</html>
